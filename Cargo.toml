[workspace]
resolver = "2"
members = [
    "crates/ultrahonk-soroban-verifier",
    "crates/test-utils",
    "contracts/rs-soroban-ultrahonk",
    "contracts/tornado_classic/contracts",
    "contracts/identity"
]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
soroban-sdk = { version = "30.0.0-rc.1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[patch.crates-io]
soroban-poseidon = { git = "https://github.com/brozorec/rs-soroban-poseidon", branch = "sdk-30" }
